# Portões de qualidade em cada PR (história 14; spec v2 §7.8 e U10).
# Os mesmos comandos dos portões locais do CLAUDE.md, mais o `test:db` com o Supabase
# local dentro do runner (o ubuntu-latest já tem Docker).
#
# Nenhum segredo aqui: o `test:db` usa só as chaves de desenvolvimento que o
# `supabase start` gera no próprio runner.
name: Portões

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: portoes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  portoes:
    name: lint, typecheck, test, build, e2e e test:db
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Sem `version`: o action lê o `packageManager` do package.json (pnpm@10.33.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes de unidade
        run: pnpm test

      - name: Build
        run: pnpm build

      # Cache do Chromium do Playwright, pela versão instalada no projeto.
      - name: Versão do Playwright
        id: playwright
        run: echo "versao=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache do Chromium do Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}-chromium

      - name: Instalar o Chromium (sem cache)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Instalar só as dependências do sistema (com cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # O visual.spec.ts é pulado no CI (referências só para win32; ver playwright.config.ts).
      - name: E2e (v1 e sem banco)
        run: pnpm test:e2e

      # Sobe o Supabase local, reseta, roda tests/db e o e2e de banco. Os serviços que o
      # blog não usa ficam de fora, para subir mais rápido.
      - name: Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api

      # O webhook do banco (pg_net, dentro do container) chama servidores do host por
      # host.docker.internal. No Linux, o Supabase CLI cria os containers com
      # host.docker.internal:host-gateway; se o nome não resolver, os testes usam o
      # gateway da rede do Supabase (HOST_DO_SITE_NO_DOCKER, ver supabase-local.md).
      - name: Endereço do host visto pelo Postgres
        run: |
          if docker exec supabase_db_blog-fut getent hosts host.docker.internal; then
            echo "host.docker.internal resolve dentro do container do banco."
          else
            gateway=$(docker network inspect supabase_network_blog-fut -f '{{(index .IPAM.Config 0).Gateway}}')
            echo "host.docker.internal não resolve; usando o gateway ${gateway}."
            echo "HOST_DO_SITE_NO_DOCKER=${gateway}" >> "$GITHUB_ENV"
          fi

      - name: Testes de banco (test:db, com o e2e de banco)
        run: pnpm test:db

      - name: Relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
